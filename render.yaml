# Render Blueprint - SIAKAD Laravel
# Deploy: dashboard Render > New > Blueprint > Connect repo (pilih render.yaml)
services:
  - type: web
    name: siakad
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: siakad-db
          property: connectionString
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: siakad
          property: host

databases:
  - name: siakad-db
    databaseName: siakad
    user: siakad
    plan: free
